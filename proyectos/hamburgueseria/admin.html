<!doctype html><html lang="es"><head>
    <base href="/proyectos/hamburgueseria/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COLINK · Pedidos</title><link rel="stylesheet" href="css/admin.css"></head><body>
<header><div class="brand"><img src="img/logo-colink.png" alt=""><div><strong>COLINK</strong><span>Panel de pedidos</span></div></div><a href="index.html">Ver sitio</a></header>
